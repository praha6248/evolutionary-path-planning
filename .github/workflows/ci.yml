name: CI

on:
  push:
  pull_request:

jobs:
  cpp:
    name: C++ build & unit tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DROBOT_GA_BUILD_PYTHON=OFF
          -DROBOT_GA_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke run
        run: ./build/robot_ga maps/map1.txt 50 8 1

  python:
    name: Python package & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install . pytest
      - name: Test
        run: pytest -v tests/test_python.py
